<style>
/* ==========================================================================
   SPONSORS

.sponsors-level {
    margin-bottom: var(--space-xl);
}

.sponsors-level:last-child {

}

.sponsors-tier {
    display: flex;

.sponsors-grid {
    display: grid;
    gap: var(--space-md);
    justify-items: center;
}

.sponsors-grid--sede {
    grid-template-columns: 1fr;
    max-width: 400px;
    margin: 0 auto;
}

.sponsors-grid--sudo {
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    max-width: 600px;
    margin: 0 auto;
}

.sponsor-card {
    width: 100%;
    text-align: center;
    padding: var(--space-md);
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    transition: transform var(--transition), box-shadow var(--transition);
}

.sponsor-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-md);
}

.sponsor-link {
    display: block;
    width: 100%;
    height: 100%;
    text-decoration: none;
    color: inherit;
}

.sponsor-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto var(--space-sm);
    border-radius: var(--radius-sm);
    background: var(--color-bg-alt);
    overflow: hidden;
    padding: 0.75rem;
}

.sponsor-card--sede .sponsor-logo { width: 100%; height: 110px; }
.sponsor-card--sudo .sponsor-logo { width: 100%; height: 140px; }

/* CTA card — persuades new sponsors */
.sponsor-card--cta {
    border: 2px dashed var(--color-border);
    background: var(--color-bg-alt);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--space-xs);
    min-height: 180px;
}

.sponsor-card--cta:hover {
    border-color: var(--color-silver);
    box-shadow: var(--shadow-sm);
}

.sponsor-cta-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--color-border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--color-slate);
    margin-bottom: 0.25rem;
}

.sponsor-cta-label {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--color-text);
}

.sponsor-cta-sub {
    font-size: 0.8rem;
    color: var(--color-slate);
    line-height: 1.4;
    max-width: 160px;
    margin: 0 auto;
}

.sponsor-logo span {
    font-size: 0.8rem;
    color: var(--color-slate);
}

.sponsor-logo img {
    max-width: 100%;
    height: 100%;
    width: auto;
    object-fit: contain;
}

.sponsor-logo--dark {
    background: #111111;
}

.sponsor-name {
    font-size: 0.9rem;
    font-weight: 600;
